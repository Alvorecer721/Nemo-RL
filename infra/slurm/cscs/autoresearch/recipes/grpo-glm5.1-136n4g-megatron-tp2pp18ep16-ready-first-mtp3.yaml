defaults: ./grpo-glm5.1-136n4g-megatron-tp2pp18ep16-ready-first.yaml

# Matched challenger to the certified 72-train + 64-rollout-node GLM-5.1
# recipe. GLM-5.1 BF16 needs TP32 to leave HBM for runtime state on GH200, and
# NCCL reshard does not support rollout PP, so retain TP32/PP1/EP32 and change
# only decoding. The checkpoint has one native MTP layer; reuse it for three
# draft steps, matching Swiss AI's production SGLang serving configuration.
policy:
  generation:
    vllm_kwargs:
      speculative_config:
        method: deepseek_mtp
        num_speculative_tokens: 3
        # vLLM 0.25.1 DeepSeekMTP does not implement get_top_tokens(), so its
        # local-argmax optimization is not supported for this native drafter.

logger:
  wandb:
    name: glm51-r3-ready-first-136n-tp2-vllm-dp8-mtp3
