# Apertus-1.5 8B offline-DPO SMOKE probe over a synthetic tools/thinking preference set.
#
# Purpose: exercise ToolThinkingPreferenceProcessor (data.processor:
# apertus_tool_thinking_preference) end-to-end on real GPUs — the full matrix of
# thinking × tools × multi-turn / single-turn data, with the Apertus developer block
# (Deliberation / Tool Capabilities) assembled by the chat template, a single BOS, no
# spurious EOS, and the DPO loss on the final assistant turn only.
#
# Data is generated by tools/build_offline_dpo_apertus_testset.py (the launcher
# probe_dpo_toolthinking_apertus.slurm regenerates it in a prologue). `tools` are stored
# per-row as a JSON string (Arrow cannot unify arbitrary tool `parameters` schemas across
# rows); the processor decodes them. Run via examples/run_dpo_apertus.py, which registers
# the processor. NOT a science run — batch/steps are smoke-sized.
defaults: ../../dpo.yaml
dpo:
  max_num_epochs: 5
  max_num_steps: 4
  val_period: 2
  val_batches: 2
  val_global_batch_size: 4
  val_micro_batch_size: 1
  val_at_start: true
  val_at_end: false
  seed: 42
  reference_policy_kl_penalty: 0.1
  preference_average_log_probs: true
  preference_loss_weight: 1.0
  sft_loss_weight: 0.0
checkpointing:
  enabled: false
data:
  max_input_seq_length: 2048
  train:
    dataset_name: PreferenceDataset
    data_path: data/dpo_apertus_testset/train.jsonl
    split: train
    processor: apertus_tool_thinking_preference
  validation:
    dataset_name: PreferenceDataset
    data_path: data/dpo_apertus_testset/validation.jsonl
    split: train
  default:
    dataset_name: PreferenceDataset
    processor: apertus_tool_thinking_preference
policy:
  model_name: /capstor/store/cscs/swissai/infra01/apertus_1p5/hf_checkpoints/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200  # pragma: allowlist secret
  tokenizer:
    name: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct_thinking_token_fixed_tools_fixed
    disable_default_system_prompt: true   # emit an empty <|system_start|><|system_end|> instead of the Apertus Omni default
  train_global_batch_size: 4
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  optimizer: null
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 2
    sequence_parallel: false
    bias_activation_fusion: false
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
    scheduler:
      lr_warmup_iters: 1
      lr_decay_iters: 4
      lr_decay_style: constant
logger:
  wandb_enabled: false
  tensorboard_enabled: true
  log_dir: logs/probe-dpo-apertus-toolthinking
  monitor_gpus: true
cluster:
  gpus_per_node: 4
  num_nodes: 1
