defaults: grpo-apertus1p5-70b-16n4g-megatron-tp2pp4-sc-bench.yaml

# Keep the lag-2 benchmark topology, but prevent a rare actor/rollout
# likelihood-ratio tail from dominating an optimizer update.
loss_fn:
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2.0

# Safety policy: completed rollouts more than two trainer versions old must
# never enter an optimizer batch, independent of normal pipeline timing.
async_rl:
  sampler:
    max_staleness_versions: 2

logger:
  wandb:
    name: nemo-rl-70b-tp2pp4-tis2-${oc.env:AP_ANSWER_MARKER,boxed}-seed${oc.env:AP_SEED,42}
