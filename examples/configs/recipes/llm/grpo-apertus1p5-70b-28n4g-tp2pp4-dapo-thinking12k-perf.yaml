# Hypothesis: process packed loss jointly to reduce per-sequence launches and TP calls.
defaults: grpo-apertus1p5-70b-28n4g-tp2pp4-dapo-thinking12k-control.yaml
grpo:
  max_num_steps: 6
checkpointing:
  enabled: false
policy:
  sequence_packing:
    fuse_loss: true
  megatron_cfg:
    env_vars:
      NRL_LOG_LEVEL: DEBUG
logger:
  wandb_enabled: false
