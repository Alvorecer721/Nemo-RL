# Async-GRPO variant of the validated colocated probe — paves the way for NeMo Gym.
# Purpose: exercise the ASYNC vLLM worker (AsyncLLM) with Apertus and confirm the xIELU
# disk-load carries to the async path (gen-KL ~0.0003), the one unverified prerequisite for gym.
# Async GRPO requires non-colocated: on 1 node this splits 2 GPUs for generation + 2 for
# training (TP2/DP1, no host-offload), so it does NOT exercise the colocated refit/sleep_level path.
defaults: probe-grpo-apertus1p5-8b-1n4g-megatron.yaml

loss_fn:
  use_importance_sampling_correction: true

grpo:
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1

policy:
  generation:
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 2
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 2
