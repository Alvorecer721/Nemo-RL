# DEBUG recipe: refit self-diff inside the vLLM worker (pre/post step-0 refit).
# Derived from probe-grpo-apertus1p5-8b-1n4g-megatron.yaml, but:
#   - defaults chain to THIS worktree (v060-online-dpo), not v060-mlm-restore
#   - gpu_memory_utilization 0.40 (0.55 OOMs on wake_up)
#   - max_num_steps 1; run with NRL_DEBUG_REFIT_SELFDIFF_EXIT=1 to stop right
#     after the step-0 refit + post dump, before any rollout.
defaults: /iopsstor/scratch/cscs/xyixuan/apertus/nemo-rl-worktrees/v060-online-dpo/examples/configs/grpo_math_8B_megatron.yaml

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_num_steps: 1
  val_period: 0
  val_at_start: false

data:
  train:
    dataset_name: DeepScaler   # few-MB download; OpenMathInstruct-2 is ~20GB
    split_validation_size: 0.05

checkpointing:
  enabled: false

policy:
  model_name: /capstor/store/cscs/swissai/infra01/apertus_1p5/hf_checkpoints/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200
  tokenizer:
    name: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct_thinking_token_fixed.snapshot-20260611
  train_global_batch_size: 32   # = num_prompts_per_step * num_generations_per_prompt
  train_micro_batch_size: 1
  logprob_batch_size: 2
  max_total_sequence_length: 2048

  megatron_cfg:
    converter_type: "ApertusForCausalLM"
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    bias_activation_fusion: false

  generation:
    max_new_tokens: 512
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.40
      max_model_len: 2048

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  log_dir: /iopsstor/scratch/cscs/xyixuan/apertus/nemo-rl-worktrees/v060-online-dpo/logs/refit-selfdiff

cluster:
  gpus_per_node: 4
  num_nodes: 1
