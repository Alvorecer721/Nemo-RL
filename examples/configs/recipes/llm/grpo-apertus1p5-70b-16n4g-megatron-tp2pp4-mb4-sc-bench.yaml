defaults: grpo-apertus1p5-70b-16n4g-megatron-tp2pp4-sc-bench.yaml

# Four sequences per trainer microbatch instead of one, the nearest safe
# analogue of verl's 16384-token dynamic microbatches on this layout. The
# larger activations need selective recompute (core attention only).
policy:
  train_micro_batch_size: 4
  logprob_batch_size: 4
  megatron_cfg:
    activation_checkpointing: true
    recompute_granularity: selective
