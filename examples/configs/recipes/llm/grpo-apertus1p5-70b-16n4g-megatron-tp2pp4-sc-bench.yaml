defaults: ../../grpo_math_8B_megatron.yaml

# Apertus RL framework benchmark, NeMo RL side (SingleController, non-colocated).
# Mirrors the verl spec: GSM8K, 768-sample optimizer batches, PPO-clip 0.2 with
# dual-clip 3.0, no KL, no reference model, AdamW 1e-6 constant, bracket-answer
# reward, deliberation off. verl takes 96 prompts x 16 samples and two optimizer
# steps per RL step; the SC split path requires one optimizer step per RL step,
# so this recipe runs 48 prompts x 16 samples for 92 steps (same 70,656 samples,
# same 92 updates of 768). Weights sync after every update: a 3.6 s reshard
# refit makes that affordable where verl syncs every second update, and the
# fresher policy is kept as a deliberate NeMo RL advantage (weight_sync_period 2
# reproduces verl's cadence exactly). Staleness is counted in updates: 16
# versions here equals verl's max_off_policy_threshold of 8 syncs.
# Model and tokenizer come from the frozen rl-bench folder via the launcher.
# Only the final step is checkpointed, weights only, so the trained model can
# be exported to HF and evaluated with the same greedy protocol as the start.
grpo:
  num_prompts_per_step: 48
  num_generations_per_prompt: 16
  max_num_epochs: 1
  max_num_steps: 92
  normalize_rewards: true
  use_leave_one_out_baseline: false
  overlong_filtering: false
  val_period: 0
  val_at_start: false
  val_at_end: false
  seed: ${oc.decode:${oc.env:AP_SEED,42}}
  use_dynamic_sampling: false
  skip_reference_policy_logprobs_calculation: true
  async_grpo: null
  cot_think_token_ids:
  - 32
  - 33
loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: 3.0
  token_level_loss: true
  use_importance_sampling_correction: true
checkpointing:
  enabled: true
  checkpoint_dir: ${oc.env:AP_RUN_DIR}/checkpoints
  metric_name: null
  higher_is_better: true
  keep_top_k: null
  save_period: ${oc.decode:${oc.env:AP_SAVE_PERIOD,100000}}
  checkpoint_must_save_by: null
  save_optimizer: false
  save_data_plane: true
policy:
  model_name: ${oc.env:AP_CKPT}
  tokenizer:
    name: ${oc.env:AP_TOKENIZER}
    chat_template_kwargs: null
  train_global_batch_size: 768
  train_micro_batch_size: 2
  logprob_batch_size: 2
  max_total_sequence_length: 1024
  max_grad_norm: 1.0
  sequence_packing:
    enabled: false
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  megatron_cfg:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 4
    sequence_parallel: true
    activation_checkpointing: true
    recompute_granularity: selective
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    bias_activation_fusion: false
    use_fused_linear_logprobs: false
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      use_precision_aware_optimizer: false
    scheduler:
      lr_decay_style: constant
      lr_warmup_iters: 0
      lr_warmup_init: 1.0e-6
  generation:
    max_new_tokens: 512
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids:
    - 2
    - 68
    - 72
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 4
        gpus_per_node: 4
    vllm_cfg:
      env_vars:
        PYTHONPATH: ''
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.75
      max_model_len: 1024
      async_engine: true
      use_tqdm: false
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
data:
  max_input_seq_length: 512
  shuffle: false
  num_workers: 1
  train:
    dataset_name: GSM8K
    split: train
    split_validation_size: 0.0
  validation: null
  default:
    prompt_file: null
    system_prompt_file: examples/prompts/apertus_bench_gsm8k_system_${oc.env:AP_ANSWER_MARKER,boxed}.txt
    processor: math_hf_data_processor
    env_name: bracket_math
env:
  bracket_math:
    num_workers: 16
    reward: composite
    answer_marker: ${oc.env:AP_ANSWER_MARKER,boxed}
data_plane:
  enabled: true
  impl: transfer_queue
  backend: simple
async_rl:
  sampler:
    name: windowed
    max_staleness_versions: 16
  weight_sync_period: 1
  recompute_kv_cache_after_weight_updates: false
  min_groups_for_streaming_train: 48
  max_inflight_prompts: 96
  # Two steps of groups. A deep buffer lets rollouts age past the staleness
  # window while they wait, and every evicted group burns a prompt from the
  # single epoch: run 3283091 evicted 3072 groups, trained at lag 16, and
  # exhausted the dataloader one step early with no final checkpoint.
  max_buffered_rollouts: 96
  diagnostics: false
  rollout_failure:
    max_infra_attempts_per_prompt: 5
    max_data_attempts_per_prompt: 2
    backoff_base_s: 1.0
    max_backoff_s: 30.0
    max_skipped_prompts: 0
    max_consecutive_dropped_prompts: 0
    min_step_batch_fraction: 0.9
    on_dropped_prompt: shrink
    native:
      generation_timeout_s: 3600
      env_timeout_s: 600
  stall_watchdog:
    interval_s: 30
    stall_timeout_s: 4200
    stall_action: abort
    gym_subprocess_check: false
  generation_fleet_health:
    enabled: false
  generation_router:
    enabled: false
logger:
  log_dir: ${oc.env:AP_RUN_DIR}/tb
  wandb_enabled: true
  wandb:
    project: apertus-benchmarks
    entity: ml-team-cscs
    name: nemo-rl-70b-tp2pp4-${oc.env:AP_ANSWER_MARKER,boxed}-seed${oc.env:AP_SEED,42}
  tensorboard_enabled: true
  monitor_gpus: true
  gpu_monitoring:
    collection_interval: 2
    flush_interval: 2
cluster:
  gpus_per_node: 4
  num_nodes: 16
  segment_size: null
