defaults: grpo-glm5.1-80n4g-megatron-async-vllm-tp32-checkpoint-save.yaml

# Phase B runs in a new allocation. It discovers step_1, restores optimizer,
# scheduler, replay and data cursors, then performs step 2. A second multi-TiB
# output checkpoint is unnecessary for this restoration proof.
checkpointing:
  enabled: false
  checkpoint_must_save_by: null

logger:
  log_dir: ${oc.env:GLM_RUN_DIR}/tb
  wandb:
    name: glm51-cross-allocation-checkpoint-resume
