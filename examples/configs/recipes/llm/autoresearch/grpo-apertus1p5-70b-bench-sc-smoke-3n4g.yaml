defaults: grpo-apertus1p5-70b-bench-sc.yaml

# Plumbing smoke for the 70B benchmark recipe: one TP4/PP2 trainer replica on two
# nodes, one TP4 vLLM engine on the third, two tiny steps.
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_num_steps: 2
policy:
  train_global_batch_size: 16
  generation:
    colocated:
      resources:
        num_nodes: 1
        gpus_per_node: 4
env:
  bracket_math:
    num_workers: 4
async_rl:
  min_groups_for_streaming_train: 4
  max_inflight_prompts: 8
  max_buffered_rollouts: 64
cluster:
  num_nodes: 3
