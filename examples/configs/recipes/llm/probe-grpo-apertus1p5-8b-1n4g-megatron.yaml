# Phase-0 probe: STOCK v0.6.0 GRPO on Apertus 1.5 8B — zero new algorithm code.
# Purpose: validate the online-loop legs never exercised by DPO:
#   (1) vLLM 0.17.1 loading Apertus inside NeMo-RL's generation workers
#   (2) per-step Megatron->vLLM weight refit for our arch (xIELU/QK-norm/266k)
#   (3) generation-vs-training logprob agreement (lp_error gate)
# Defaults chain DELIBERATELY to the worktree's v0.6.0 configs (the repo-local
# newer grpo yamls dropped converter_type, which v0.6.0's refit requires).
defaults: /iopsstor/scratch/cscs/xyixuan/apertus/nemo-rl-worktrees/v060-mlm-restore/examples/configs/grpo_math_8B_megatron.yaml

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_num_steps: 3
  val_period: 0
  val_at_start: false

data:
  train:
    dataset_name: DeepScaler   # few-MB download; OpenMathInstruct-2 is ~20GB
    split_validation_size: 0.05

checkpointing:
  enabled: false

policy:
  model_name: /capstor/store/cscs/swissai/infra01/apertus_1p5/hf_checkpoints/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200  # pragma: allowlist secret
  tokenizer:
    name: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct_thinking_token_fixed.snapshot-20260611
  train_global_batch_size: 32   # = num_prompts_per_step * num_generations_per_prompt
  train_micro_batch_size: 1
  logprob_batch_size: 2
  max_total_sequence_length: 2048

  megatron_cfg:
    converter_type: "ApertusForCausalLM"
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    bias_activation_fusion: false

  generation:
    max_new_tokens: 512
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.55
      max_model_len: 2048

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  log_dir: /iopsstor/scratch/cscs/xyixuan/apertus/Nemo-RL/logs/grpo-apertus-probe

cluster:
  gpus_per_node: 4
  num_nodes: 1
