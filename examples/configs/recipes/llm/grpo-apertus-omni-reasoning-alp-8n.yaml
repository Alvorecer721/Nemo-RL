defaults: grpo-apertus1p5-8b-1n4g-megatron-probe.yaml
grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 8
  max_num_steps: 2000
  val_period: 50
  val_at_start: true
  max_val_samples: 500
  reward_shaping:
    enabled: true
    alp_coef: 1.0
    max_response_length: 6000
policy:
  train_global_batch_size: 512
  max_total_sequence_length: 8192
  tokenizer:
    chat_template_kwargs:
      enable_thinking: true
  generation:
    max_new_tokens: 6000
    stop_token_ids:
    - 2
    - 68
    - 72
    vllm_cfg:
      max_model_len: 8192
data:
  _override_: true
  train:
    dataset_name: RLPromptDataset
    data_path: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/alignment/deepvision_rl
    split: train
    max_prompt_len: 2048
    processor: mmididx_grpo_data_processor
    task_name: rl_prompt
    env_name: single_turn_verifier
  validation:
    dataset_name: math500
    processor: math_data_processor
    task_name: math
    env_name: math
env:
  single_turn_verifier:
    num_workers: 8
cluster:
  num_nodes: 8
checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-apertus-omni-reasoning-alp-8n
  save_period: 50
  keep_top_k: 5
logger:
  wandb_enabled: true
  log_dir: logs/grpo-apertus-omni-reasoning-alp-8n
  wandb:
    project: grpo-apertus
    name: omni-reasoning-alp-8n
