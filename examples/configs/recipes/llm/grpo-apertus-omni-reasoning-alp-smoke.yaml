defaults: grpo-apertus-omni-reasoning-alp-8n.yaml
grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4
  max_num_steps: 3
  val_period: 0
  val_at_start: false
policy:
  train_global_batch_size: 16
  generation:
    max_new_tokens: 2048
cluster:
  num_nodes: 1
logger:
  wandb_enabled: false
  log_dir: logs/grpo-apertus-omni-smoke
