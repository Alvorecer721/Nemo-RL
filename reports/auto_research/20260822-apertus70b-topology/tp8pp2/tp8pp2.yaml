defaults: /opt/nemo-rl/examples/configs/recipes/llm/dpo-apertus1p5-8b-maxmin-megatron.yaml

dpo:
  max_num_steps: 10
  val_batches: 1
  val_period: 1000
  val_at_start: false
  val_at_end: false

checkpointing:
  enabled: false

data:
  max_input_seq_length: 2048

policy:
  model_name: /capstor/store/cscs/swissai/infra01/apertus_1p5/hf_checkpoints/ap1p5-70b-sft-262k-3000
  tokenizer:
    name: /capstor/store/cscs/swissai/infra01/apertus_1p5/hf_checkpoints/ap1p5-70b-sft-262k-3000
  train_global_batch_size: 32
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  megatron_cfg:
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 2
    context_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    use_fused_linear_logprobs: true
    fused_linear_logprobs_chunk_size: 256
    bias_activation_fusion: false
    distributed_data_parallel_config:
      overlap_grad_reduce: false
      overlap_param_gather: false

logger:
  tensorboard_enabled: true
  wandb_enabled: false
  monitor_gpus: true

cluster:
  gpus_per_node: 4
  num_nodes: 4
