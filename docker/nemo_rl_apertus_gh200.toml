# EDF template for Apertus/NeMo-RL Megatron smoke and DPO experiments on GH200.
# Replace the image with the tag produced from Dockerfile.nemo_rl_v0_6_0_megatron.
# NOTE: keep mounts/annotations/env in sync with nemo_rl.toml (only `image` differs)

image = "REGISTRY/nemo-rl:v0.6.0-apertus-mcore-gh200"
mounts = ["/capstor", "/iopsstor", "/users"]
writable = true
workdir = "/opt/nemo-rl"

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
SHELL = "/bin/bash"
CUDA_CACHE_DISABLE = "0"
HF_HUB_ENABLE_HF_TRANSFER = "1"
PMIX_MCA_psec = "native"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "0"
NCCL_RAS_ENABLE = "0"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_SAFE_DEVMEM_COPY_THRESHOLD = "16777216"
FI_CXI_COMPAT = "0"
